services:
  spring-monitor:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: spring-monitor:local
    container_name: spring-monitor
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 2.0
    ports:
      - "${MONITOR_BIND_ADDRESS:-127.0.0.1}:${MONITOR_PORT:-8080}:8080"
    environment:
      MONITOR_AUTH_USERNAME: ${MONITOR_AUTH_USERNAME:?Set MONITOR_AUTH_USERNAME in .env}
      MONITOR_AUTH_PASSWORD: ${MONITOR_AUTH_PASSWORD:?Set MONITOR_AUTH_PASSWORD in .env}
      MONITOR_DISCOVERY_ROOT: /workspace
    volumes:
      - ${MONITOR_WORKSPACE_PATH:-./spring-monitor/workspace}:/workspace:ro
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "5"